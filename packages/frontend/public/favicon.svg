<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VOVPLAN">
  <!--
    Знак VOVPLAN: «V» над рельефом.

    Вектор, а не PNG: вкладка просит 16 пикселей, панель задач — 32, закладки
    иногда 64, и одна картинка обслуживает все размеры без замыливания.

    Всё внутри рассчитано на 16 пикселей — там, где фавиконку и видят чаще
    всего. Отсюда толстая «V» (девятая часть ширины: тоньше — и на экране без
    масштабирования она рассыпается в серую полоску), крупная волна рельефа
    вместо тонкой линии горизонта и всего два цвета поверх фона.

    Остриё «V» держится над рельефом, а не утоплено в него: в мелком размере
    перекрытый угол читается как «U», и знак перестаёт быть буквой.
  -->
  <defs>
    <!-- Небо: фирменный ирис, к низу светлее — так знак не выглядит плоским -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312e81" />
      <stop offset="1" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" />
      <stop offset="1" stop-color="#15803d" />
    </linearGradient>
    <!-- Скруглённая рамка: рельеф обрезается по ней, а не торчит углами -->
    <clipPath id="frame">
      <rect width="64" height="64" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="64" height="64" fill="url(#sky)" />
    <path d="M0 50 C 16 45.5 28 54 44 51 C 54 49 59 48 64 48.5 L 64 64 L 0 64 Z" fill="url(#land)" />
  </g>

  <path
    d="M20 16 L32 39 L44 16"
    fill="none"
    stroke="#ffffff"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
