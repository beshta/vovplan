name: Deploy

# Образы собираются здесь, а не на VPS: сборка на месте оставляла до 4 ГБ
# кэша buildkit при диске в 14 ГБ, и деплой упирался в «no space left».
# На сервере остаётся только docker pull + перезапуск.
#
# Запускается после успешного CI (сломанная сборка на прод не уедет)
# плюс кнопкой на вкладке Actions.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vovplan-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/vovplan-web

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run срабатывает и на упавшем CI — отсекаем
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Логин в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Кэш слоёв живёт в самом реестре: следующая сборка переиспользует
      # неизменившиеся слои, а на диск VPS ничего не оседает.
      - name: Собрать и опубликовать backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Собрать и опубликовать web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.WEB_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.WEB_IMAGE }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Проверить, что секреты заданы
        id: check
        env:
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Секреты деплоя не заданы — шаг пропущен. См. DEPLOY.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Обновить прод
        if: steps.check.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DIR: ${{ secrets.DEPLOY_DIR }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          # Владелец репозитория, а не запустивший: под ним публикуются образы
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          # Секрет принимаем в двух видах: как есть и в base64. При копировании
          # ключа руками легко потерять обрамляющие строки или перевод в конце —
          # тогда ssh падает с невнятным «error in libcrypto». base64 от этого
          # избавляет: одна строка без пробелов.
          if printf '%s' "$SSH_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > ~/.ssh/id_deploy
          else
            printf '%s' "$SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy

          # Проверяем ключ до подключения — иначе ошибка выглядит как отказ в
          # доступе, хотя дело в битом файле
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY не читается. Скопируйте вывод 'cat ~/.ssh/<ключ>' целиком, вместе со строками -----BEGIN----- и -----END-----, либо положите в секрет base64 от файла (см. DEPLOY.md)"
            exit 1
          fi

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Токен ephemeral и живёт только внутри этого запуска — на сервере
          # после pull сразу разлогиниваемся, чтобы не оставлять учётку.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$SSH_USER@$HOST" \
            "GH_USER='$GH_USER' GH_TOKEN='$GH_TOKEN' SHA='$SHA' OWNER='$OWNER' DIR='${DIR:-$HOME/vovplan}' bash -s" <<'REMOTE'
            set -euo pipefail
            cd "$DIR"
            git fetch --all
            git reset --hard origin/main

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin

            # Тянем образ, собранный из ровно этого коммита. Путь — по владельцу
            # репозитория (имена в ghcr только в нижнем регистре).
            export BACKEND_IMAGE="ghcr.io/${OWNER,,}/vovplan-backend:${SHA}"
            export WEB_IMAGE="ghcr.io/${OWNER,,}/vovplan-web:${SHA}"
            docker compose -f docker-compose.prod.yml --env-file .env pull backend web
            docker compose -f docker-compose.prod.yml --env-file .env up -d

            docker logout ghcr.io
            # Старые образы не копим — диск на VPS тесный
            docker image prune -af
            docker compose -f docker-compose.prod.yml ps
            df -h /
          REMOTE

      - name: Проверить, что сайт отвечает
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://vovplan.com || true)
            [ "$code" = "200" ] && { echo "сайт отвечает 200"; exit 0; }
            sleep 10
          done
          echo "::error::vovplan.com не ответил 200 после деплоя"
          exit 1
