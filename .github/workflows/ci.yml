name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Модуль чтения DWG собирается здесь, а не берётся из репозитория.
      # Собранный .wasm в репозитории лежит ради локальной разработки и Docker
      # (чтобы им не требовался Rust), но полагаться на него нельзя: правку в
      # tools/dwg-wasm легко закоммитить, забыв пересобрать, — и в прод уехал бы
      # старый модуль при новых исходниках, молча и без единой ошибки сборки.
      - name: Rust toolchain для DWG
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Кэш сборки DWG
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/dwg-wasm/target
          key: dwg-wasm-${{ runner.os }}-${{ hashFiles('tools/dwg-wasm/Cargo.toml', 'tools/dwg-wasm/src/**') }}
          restore-keys: dwg-wasm-${{ runner.os }}-

      - name: Собрать DWG-модуль
        run: npm run build:dwg

      # Расхождение — не ошибка сборки: собранный вручную и собранный здесь
      # .wasm могут отличаться байтами при одном и том же исходнике. Но знать
      # об этом полезно, поэтому предупреждение в журнале есть.
      - name: Проверить, что закоммиченный модуль не устарел
        run: |
          if ! git diff --quiet -- packages/frontend/src/wasm/dwg.wasm; then
            echo "::warning::Закоммиченный dwg.wasm отличается от собранного из исходников — пересоберите локально (npm run build:dwg) и закоммитьте"
          fi

      - name: Generate Prisma client
        run: npx turbo db:generate

      - name: Check schema.prisma ↔ schema.postgres.prisma in sync
        working-directory: packages/backend/prisma
        run: |
          diff <(sed -n '/SHARED SCHEMA BELOW/,$p' schema.prisma) \
               <(sed -n '/SHARED SCHEMA BELOW/,$p' schema.postgres.prisma) \
            || { echo "::error::Схемы разошлись — правьте обе (общая часть после маркера SHARED)"; exit 1; }

      - name: Validate postgres schema
        working-directory: packages/backend
        run: npm run db:validate:pg
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Create SQLite schema
        run: npm run db:push --workspace packages/backend

      - name: Lint (typecheck)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
