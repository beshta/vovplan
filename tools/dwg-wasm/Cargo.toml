[package]
name = "dwg-wasm"
version = "0.1.0"
edition = "2021"
publish = false

# Собирается только под wasm32-unknown-unknown и подключается во фронтенде
# как обычный ленивый чанк — рядом с загрузчиками FBX и OBJ.
[lib]
crate-type = ["cdylib"]

[dependencies]
# MPL-2.0 — разрешительная лицензия: открывать надо только правки в файлах самой
# библиотеки, наш код остаётся наш. Читает DWG R13–R2018 вместе с телами ACIS,
# ради которых всё и затевалось.
acadrust = "0.4.1"

# Нужен не нам, а ahash внутри acadrust. Под wasm32 у getrandom нет источника
# случайности по умолчанию, поэтому подключаем свой — см. src/rng.rs.
getrandom = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Раскрутка стека в wasm всё равно неполноценна, а размер бандла важен:
# сбой разбора превращается в исключение на стороне JS, там его и ловим.
panic = "abort"
strip = true
