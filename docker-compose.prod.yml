# ── VOVPLAN production stack ──
# Запуск:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - uploads:/app/packages/backend/uploads      # модели GLB + текстуры ландшафта
      - tilecache:/app/packages/backend/.tilecache  # кэш тайлов рельефа

  web:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    # Только localhost:8080 — перед контейнером стоит системный nginx (TLS + домен).
    # Он проксирует vovplan.com → 127.0.0.1:8080. Порты 80/443 держит nginx.
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
  uploads:
  tilecache:
